apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

// Load Phone Key configuration from local.properties (not committed to version control)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.noke.nokeapidemo"
        minSdkVersion 21  // Required for Phone Key support (Android Keystore P-256)
        targetSdkVersion 34
        versionCode 20
        versionName "0.11.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Phone Key configuration — set these in local.properties (never commit credentials)
        // phoneKeyUserId      : Integer user ID from Noke backend (required for ION-2 unlock)
        // phoneKeyApiKey      : API key for the smart-entry gateway; sent as
        //                       "Authorization: ApiKey <phoneKeyApiKey>" for Phone Key requests
        // phoneKeyEmail       : Email associated with the gateway tenant account
        // phoneKeyCompanyId   : Company ID for the gateway (header: CompanyId)
        // phoneKeySiteId      : Site ID for the gateway (header: SiteId)
        // phoneKeyBaseUrl     : Override base URL (defaults to api-gateway.smartentry.noke.com)
        buildConfigField "String", "PHONE_KEY_USER_ID",
                "\"${localProperties.getProperty('phoneKeyUserId', '')}\""
        buildConfigField "String", "PHONE_KEY_BASE_URL",
                "\"${localProperties.getProperty('phoneKeyBaseUrl', 'https://api-gateway.smartentry.noke.dev/')}\""
        buildConfigField "String", "PHONE_KEY_API_KEY",
                "\"${localProperties.getProperty('phoneKeyApiKey', '')}\""
        buildConfigField "String", "PHONE_KEY_EMAIL",
                "\"${localProperties.getProperty('phoneKeyEmail', '')}\""
        buildConfigField "String", "PHONE_KEY_COMPANY_ID",
                "\"${localProperties.getProperty('phoneKeyCompanyId', '')}\""
        buildConfigField "String", "PHONE_KEY_SITE_ID",
                "\"${localProperties.getProperty('phoneKeySiteId', '')}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'com.noke.nokeapidemo'
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    
    // AndroidX Libraries
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Coroutines - Version 1.7.3 for AGP 7.4.2 compatibility
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // ThreeTenABP - Required for Phone Key date/time handling
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.5'
    
    // Noke Mobile Library
    implementation project(path: ':nokemobilelibrary')
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
