
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.noke.nokemobilelibrary'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21  // Required for Android Keystore features
        targetSdkVersion 34
        versionCode 30
        versionName "0.10.1"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Force Java 17 toolchain
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Existing dependencies
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    
    // Kotlin - Using 1.8.22 for AGP 7.4.2 compatibility
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    
    // Coroutines - Downgraded to 1.7.3 for AGP 7.4.2 compatibility
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    
    // Security (EncryptedSharedPreferences)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    
    // Networking - Downgraded for AGP 7.4.2 compatibility
    implementation "com.squareup.okhttp3:okhttp:4.10.0"
    
    // Date/Time
    implementation "com.jakewharton.threetenabp:threetenabp:1.4.5"
    
    // JSON serialization
    implementation 'com.google.code.gson:gson:2.8.9'
    
    // AndroidX
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.appcompat:appcompat-resources:1.6.1"
    
    // Crypto (Tink for base64 decoding and other utilities)
    implementation "com.google.crypto.tink:tink-android:1.10.0"
    
    // Testing - Mockk for Kotlin
    testImplementation "io.mockk:mockk:1.13.8"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.0"
    testImplementation "app.cash.turbine:turbine:1.0.0"
}


ext {
    PUBLISH_GROUP_ID = 'com.noke.nokemobilelibrary'
    PUBLISH_VERSION = '0.10.1'
    PUBLISH_ARTIFACT_ID = 'noke-mobile-library'
}

